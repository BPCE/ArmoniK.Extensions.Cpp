# Dependencies for building the ArmoniK SDK (Client + Common) with MSVC.
# Versions match the last green build-windows-msvc CI run, bump them together.
#   micromamba create -f tools/windows/environment.yml
name: armonik-sdk-windows
channels:
  - conda-forge
  - nodefaults
dependencies:
  - libgrpc=1.83.1
  - libprotobuf=7.35.1
  - libabseil=20260526.0
  - nlohmann_json=3.12.0
  - zlib=1.3.2
