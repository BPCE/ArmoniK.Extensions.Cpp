name: vcpkg Windows dependencies
description: >-
  Restores the vcpkg dependencies of tools/windows/vcpkg.json from the Actions cache,
  or builds them (about 2 h) and saves them right away.
inputs:
  triplet:
    description: vcpkg target and host triplet
    required: false
    default: x64-windows-static-md
outputs:
  prefix:
    description: CMake prefix of the installed dependencies, for build.ps1 -DepsCMakePrefix
    value: ${{ github.workspace }}\build-windows\vcpkg_installed\${{ inputs.triplet }}
runs:
  using: composite
  steps:
    - name: Restore dependencies
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build-windows/vcpkg_installed
        key: vcpkg-${{ inputs.triplet }}-${{ hashFiles('tools/windows/vcpkg.json') }}

    # vcpkg reads port versions from its checkout: move it to the manifest baseline and
    # re-bootstrap so the tool matches. Host triplet = target triplet puts protoc and
    # grpc_cpp_plugin in the same prefix. Build trees go to D: (RUNNER_TEMP), C: is too small.
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        TRIPLET: ${{ inputs.triplet }}
        VCPKG_INSTALLED: ${{ github.workspace }}\build-windows\vcpkg_installed
      run: |
        $baseline = (Get-Content tools/windows/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin $baseline
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git -C "$env:VCPKG_INSTALLATION_ROOT" checkout --detach $baseline
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # The bootstrap downloads vcpkg.exe from GitHub, retry on transient network errors
        foreach ($attempt in 1..3) {
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 3) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 30
        }
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
          --x-manifest-root=tools/windows `
          --x-install-root="$env:VCPKG_INSTALLED" `
          --x-buildtrees-root="$env:RUNNER_TEMP\vcpkg\buildtrees" `
          --x-packages-root="$env:RUNNER_TEMP\vcpkg\packages" `
          --downloads-root="$env:RUNNER_TEMP\vcpkg\downloads" `
          --clean-after-build `
          --triplet=$env:TRIPLET --host-triplet=$env:TRIPLET
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Saved right away so a later failure does not throw away the build
    - name: Save dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build-windows/vcpkg_installed
        key: ${{ steps.cache.outputs.cache-primary-key }}
