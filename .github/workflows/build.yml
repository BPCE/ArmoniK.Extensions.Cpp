name: DeployTest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  versionning:
    name: Versionning
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.genver.outputs.version }}
      release: ${{ steps.genver.outputs.release }}
    steps:
    - name: Checkout
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0

    - name: Generate Version
      id: genver
      run: |
        VERSION=$(docker run --rm -v $(pwd):/repo codacy/git-version /bin/git-version --folder=/repo --release-branch=${{ github.ref_name }}-pre --dev-branch=main)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "VERSION : $VERSION"
        RELEASE=$(docker run --rm -v $(pwd):/repo codacy/git-version /bin/git-version --folder=/repo --release-branch=${{ github.ref_name }} --dev-branch=main)
        echo "release=$RELEASE" >> $GITHUB_OUTPUT
        echo "RELEASE : $RELEASE"
        echo "Version :" >> $GITHUB_STEP_SUMMARY
        echo "$VERSION" >> $GITHUB_STEP_SUMMARY
        echo "Release :" >> $GITHUB_STEP_SUMMARY
        echo "$RELEASE" >> $GITHUB_STEP_SUMMARY

  format:
    name: Format C++
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Run clang-format
        run: |
          # Pinned: other clang-format releases format the code differently
          pipx install clang-format==21.1.6

      - name: Check Diff
        id: check-diff
        run: |
          git ls-files *.{c,h,hpp,cpp,cc} | xargs clang-format -style=file:.clang-format -i
          DIFF="$(git diff --name-only)"

          if [ -z "$DIFF" ]; then
          echo "OK: Format is clean"
          else
            echo "Error: Format was not clean"
            echo "List of files:"
            echo "$DIFF"
            git diff
            exit 1
          fi

      - name: Generate patch
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        run: |
          git diff > patch-cpp.diff
      - uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        if: ${{ failure() && steps.check-diff.conclusion == 'failure' }}
        with:
          name: patch-cpp
          path: ./patch-cpp.diff

  build-cpp-packages:
    name: Build C++ Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dist: ["Alpine", "RedHat", "Ubuntu"]
    needs: [versionning]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.ref }}

      - name: Install ArmoniK Dependencies
        uses: aneoconsulting/ArmoniK.Action.Deploy/dependencies@main
        with:
            docker: true
            terraform: true
            k3s: true
            aws: true

      - name: Checkout Infra
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          repository: aneoconsulting/ArmoniK
          path: infra

      - name: Build C++ SDK
        id: build
        run: |
          source ./tools/common.sh
          export ARMONIK_SHARED_HOST_PATH=${{ github.workspace }}/infra/infrastructure/quick-deploy/localhost/all-in-one/data
          export WORKER_IMG="dockerhubaneo/armonik-sdk-cpp-dynamicworker"
          export CLIENT_IMG="dockerhubaneo/armonik-sdk-client-test"
          export WORKER_TEST_IMG="dockerhubaneo/armonik-sdk-worker-test"
          ./tools/build-deploy-end2end.sh -e "${{ matrix.dist }}" -n "$WORKER_IMG" -v "${{ needs.versionning.outputs.version}}" -a "$ARMONIK_API_VERSION_DEFAULT" -t "$WORKER_TEST_IMG"
          ./tools/build-client.sh "$CLIENT_IMG" "${{ needs.versionning.outputs.version}}" "$API_VERSION"
          export WORKER_VERSION="${{ needs.versionning.outputs.version}}-$(echo "${{ matrix.dist }}" | awk '{print tolower($0)}')"
          docker save "$WORKER_IMG:$WORKER_VERSION" | sudo k3s ctr images import /dev/stdin
          echo "worker_img=$WORKER_IMG" >> $GITHUB_OUTPUT
          echo "worker_version=$WORKER_VERSION" >> $GITHUB_OUTPUT
          echo "client_img=$CLIENT_IMG" >> $GITHUB_OUTPUT
          echo "client_version=${{ needs.versionning.outputs.version}}" >> $GITHUB_OUTPUT
          echo "worker_test_img=$WORKER_TEST_IMG" >> $GITHUB_OUTPUT

      - name: Login Docker
        run: echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_LOGIN }} --password-stdin

      - id: deploy
        name: Deploy
        uses: aneoconsulting/ArmoniK.Action.Deploy/deploy@main
        with:
          working-directory: ${{ github.workspace }}/infra
          type: localhost
          override-compute: true
          override-worker-version: ${{ steps.build.outputs.worker_version }}
          override-worker-image:  ${{ steps.build.outputs.worker_img }}
          override-worker-partition: cppdynamic

      - name: Run Client tests
        timeout-minutes: 5
        run: |
          set -ex
          export CONTROL_PLANE_URL=$(jq -r .armonik.control_plane_url "${{ steps.deploy.outputs.generated-folder }}/armonik-output.json")
          docker run --rm -t --network host -e GrpcClient__Endpoint="${CONTROL_PLANE_URL}" -e PartitionId=cppdynamic -e WorkerLib__Version="${{ needs.versionning.outputs.version}}" "${{ steps.build.outputs.client_img}}:${{ needs.versionning.outputs.version}}"

      - name: Push Docker
        run: |
          docker push "${{ steps.build.outputs.worker_img}}:${{ steps.build.outputs.worker_version }}"
          docker push "${{ steps.build.outputs.worker_test_img}}:${{ steps.build.outputs.worker_version }}"
          docker push "${{ steps.build.outputs.client_img}}:${{ steps.build.outputs.client_version }}"
          
  build-windows-msvc:
    name: Build Windows MSVC (Client + Common)
    runs-on: windows-latest
    needs: [versionning]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.ref }}

      # Prebuilt MSVC binaries from conda-forge, building gRPC with vcpkg takes hours
      - name: Install dependencies
        id: deps
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: tools/windows/environment.yml
          init-shell: none
          cache-downloads: true

      # Same script as documented for users, -Verify builds and runs tools/windows/consumer against the install
      - name: Build, install and verify
        run: >
          ./tools/windows/build.ps1
          -DepsPrefix "${{ steps.deps.outputs.environment-path }}"
          -Prefix "${{ github.workspace }}\install-windows"
          -Version "${{ needs.versionning.outputs.version }}"
          -Verify
        shell: pwsh

  build-upload-artifact:
    strategy:
      fail-fast: false
      matrix:
        type: [tar.gz, deb, rpm]
    name: Build C++ Packages [${{ matrix.type }}]
    runs-on: ubuntu-latest
    needs: [versionning]
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: ${{ github.ref }}
      - name: Build and upload tgz, rpm and deb packages 
        run: |
          cd tools/packaging
          ./make-${{ matrix.type }}.sh ${{ needs.versionning.outputs.version}}
      - name: Publish package as artefact
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          if-no-files-found: error
          path: tools/packaging/*.${{ matrix.type }}
          name: armoniksdk-${{ needs.versionning.outputs.version}}.${{ matrix.type }}
